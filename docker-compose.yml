services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatwork_slack_bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwork_slack_bridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/chatwork_slack_bridge
      PORT: "3000"
      LOG_LEVEL: info
      NODE_ENV: development
      DB_HEALTH_TIMEOUT_MS: "2000"
    ports:
      - "3000:3000"

volumes:
  postgres-data:
